[package]
name = "qhronox-staking"
version = "1.0.0"
description = "QhronoX Protocol — Real yield staking with Token-2022 transfer fee distribution"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "qhronox_staking"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "=0.29.0", features = ["init-if-needed"] }
anchor-spl  = { version = "=0.29.0", features = ["token_2022"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1