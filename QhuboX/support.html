<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support | QhuboX</title>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

    <!-- CSS (Unified Styles) --><style>
        /* -------------------------------------------------------------------------- */
        /* 1. Variables and Reset */
        /* -------------------------------------------------------------------------- */
        :root {
            --color-primary: #4f46e5; /* Indigo 600 */
            --color-primary-hover: #4338ca; /* Indigo 700 */
            --color-primary-light: #eef2ff; /* Indigo 50 */
            --color-text-dark: #1f2937; /* Gray 800 */
            --color-text-medium: #6b7280; /* Gray 500 */
            --color-border: #e5e7eb; /* Gray 200 */
            --color-background: #f7f9fb;
            --shadow-card: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-background);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem; /* Reduced padding for mobile */
        }

        /* -------------------------------------------------------------------------- */
        /* 2. Container and Layer Effect (Support Screen) */
        /* -------------------------------------------------------------------------- */

        .pantalla-support {
            width: 100%;
            max-width: 30rem; /* Slightly narrower than contact to focus on the form */
            margin: 0 auto;
            position: relative;
            padding: 0.5rem; 
        }

        /* The background layer (rotated effect) */
        .pantalla-support::before {
            content: '';
            position: absolute;
            inset: 0; /* top, right, bottom, left: 0 */
            background-color: var(--color-primary-light);
            border-radius: 1.5rem;
            z-index: 1;
            transform: rotate(1.5deg) scale(1.02); /* Opposite rotation to contact for variety */
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* The main card */
        .contenido-support {
            position: relative;
            background-color: #ffffff;
            border-radius: 1.5rem;
            box-shadow: var(--shadow-card);
            padding: 2.5rem 2rem;
            z-index: 2;
            border: 1px solid rgba(255,255,255,0.5); /* Subtle border */
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Hover Animation */
        .pantalla-support:hover .contenido-support {
            transform: translateY(-5px);
        }
        .pantalla-support:hover::before {
            transform: rotate(2.5deg) scale(1.04);
        }

        /* -------------------------------------------------------------------------- */
        /* 3. Typography and Form */
        /* -------------------------------------------------------------------------- */

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--color-text-dark);
            letter-spacing: -0.02em;
        }

        .subtitulo {
            color: var(--color-text-medium);
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        /* Form */
        .formulario-support {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            text-align: left; /* Align labels to the left */
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-text-dark);
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--color-border);
            background-color: #fff;
            font-family: inherit;
            font-size: 1rem;
            color: var(--color-text-dark);
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px var(--color-primary-light);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Primary Button */
        .btn-submit {
            margin-top: 0.5rem;
            padding: 1rem;
            border-radius: 0.75rem;
            border: none;
            background-color: var(--color-primary);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        .btn-submit:hover {
            background-color: var(--color-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Back Link */
        .volver {
            display: inline-block;
            margin-top: 2rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--color-text-medium);
            text-decoration: none;
            transition: color 0.2s;
        }

        .volver:hover {
            color: var(--color-primary);
        }

        /* -------------------------------------------------------------------------- */
        /* 5. Fixed Logo Header (Integrated from Contact Page) */
        /* -------------------------------------------------------------------------- */
        .logo-header {
            position: fixed; /* Fixed on screen */
            top: 1.5rem; /* Separation from the top edge */
            left: 1.5rem; /* Separation from the left edge */
            display: flex; /* To align the image and text */
            align-items: center;
            text-decoration: none; /* Removes underline */
            z-index: 100; /* Ensures it's above everything */
            transition: opacity 0.3s;
        }

        .logo-header:hover {
            opacity: 0.85;
        }

        .logo-header img {
            width: 2rem; /* Logo size */
            height: 2rem;
            margin-right: 0.5rem;
        }

        .logo-header span {
            font-size: 1.25rem; /* Text size (Desktop) */
            font-weight: 800;
            color: var(--color-text-dark);
            letter-spacing: -0.02em;
        }
        
        /* -------------------------------------------------------------------------- */
        /* 4. Responsive (Media Queries) */
        /* -------------------------------------------------------------------------- */
        @media (max-width: 640px) {
            /* Adjusting logo text size for mobile */
            .logo-header {
                /* Since body padding is 1.5rem, setting top/left to 1rem might look better than 1.5rem */
                top: 1rem; 
                left: 1rem;
            }
            .logo-header span {
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            .contenido-support {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- FIXED LOGO ELEMENT: Link with the image and text -->
    <a class="logo-header">
        <!-- UPDATED PATH -->
        <img src="media/6.png" alt="QhuboX Logo">
        <span>QhuboX</span>
    </a>
    
    <div class="pantalla-support">
        <div class="contenido-support">
            <header>
                <h1>Support</h1>
                <p class="subtitulo">We are here to help. Send us your query.</p>
            </header>

            <form class="formulario-support">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required />
                </div>

                <div class="input-group">
                    <label for="subject">Subject</label>
                    <select id="subject">
                        <option>General Inquiry</option>
                        <option>Technical Issue</option>
                        <option>Billing</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="4" placeholder="Describe your issue..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Send Message</button>
            </form>

          
        </div>
    </div>
</body>
</html>
