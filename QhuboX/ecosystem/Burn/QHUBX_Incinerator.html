<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QHUBX Incinerator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h2 id="wallet-status">Wallet not connected</h2>
    <div id="qhubx-balance" style="display: none; color: #ff4444; position: absolute; top: 6.3rem; right: 2.5rem; font-size: 0.9rem; background: rgba(0,0,0,0.6); padding: 0.5rem 1rem; border-radius: 0.5rem; border: 1px solid #ff4444;">
        Balance: Loading...
    </div>
    <button id="connect-wallet">Connect Wallet</button>

    <div class="ruleta-container">
        <div class="ruleta-layout">
            <div class="botones">
                <label for="apuesta" style="font-size: 1rem; color: #fff; text-shadow: 0 0 5px #ff4444;">Amount to BURN (QHUBX):</label>
                <input type="number" id="apuesta" value="100" min="1" step="1">
                <button id="play">
                    <img src="assets/images/6.png" alt="Solana Logo">
                    BURN Crypto!
                </button>
            </div>
            <img id="ruleta" src="assets/images/61.png" alt="Incinerador" />
        </div>
    </div>

    <div id="resultado"></div>
    <div id="confetti-container"></div>
    
    <div id="copyright">
        <img src="assets/images/logo.svg" alt="" class="logo">
         &copy; 2026 || QhuboX, All rights reserved.
    </div>

    <div id="social-links-container">
        <a href="/QhuboX.html" class="social-link-3d">
            <img src="assets/images/6.png" alt="">
            <span></span>
        </a>

        <a href="#" target="_blank" class="social-link-3d">
            <img src="assets/images/icono_x.svg" alt="">
            <span></span>
        </a>

        <a href="/ecosystem/QhuboX.html" class="social-link-3d">
            <img src="assets/images/icono_link.svg" alt="">
            <span></span>
        </a>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
