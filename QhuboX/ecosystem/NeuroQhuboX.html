        function translateUI(lang) {
            currentLang = lang;
            const t = i18n[lang] || i18n['en'];
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('txt-btn-analyze').innerText = t.btn_analyze;
            if(userData) renderDashboard(); else renderQuestions();
        }

        function renderQuestions() {
            const c = document.getElementById('questions-container'); c.innerHTML = '';
            const t = i18n[currentLang] || i18n['en'];
            t.questions.forEach((q, i) => {
                const card = document.createElement('div');
                card.style = "background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 15px; padding: 15px;";
                card.innerHTML = `<p style="font-size:0.8rem; margin-bottom:10px; font-weight:600;">${q}</p><div style="display:flex; gap:5px;">` + 
                    [0,1,2,3,4].map(v => `<button class="opt-btn ${scores[i]===v?'active':''}" onclick="setScore(${i},${v})">${v}</button>`).join('') + `</div>`;
                c.appendChild(card);
            });
        }

        function setScore(i,v) { scores[i]=v; renderQuestions(); }

        function calculateResults() {
            const sum = scores.reduce((a,b)=>a+b,0);
            // lvl: 0 (Óptimo) a 3 (Severo)
            userData = { 
                lvl: sum > 18 ? 3 : sum > 12 ? 2 : sum > 6 ? 1 : 0, 
                completed: [], 
                dateSet: new Date().toISOString() 
            };
            localStorage.setItem('neuro_v4_0', JSON.stringify(userData)); 
            renderDashboard();
        }

        function renderDashboard() {
            document.getElementById('test-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            const t = i18n[currentLang] || i18n['en'];
            
            document.getElementById('res-score').innerText = userData.lvl;
            document.getElementById('res-status').innerText = t.status[userData.lvl];
            document.getElementById('txt-btn-log').innerText = t.btn_log;
            document.getElementById('txt-btn-reset').innerText = t.btn_reset;
            document.getElementById('txt-level-label').innerText = t.level_label;
            document.getElementById('txt-mission-tag').innerText = t.mission_tag;
            document.getElementById('txt-energy-label').innerText = t.energy;

            // LÓGICA AUTO-TAREA SEGÚN TEST
            if (!window.initialEnergySet) {
                if (userData.lvl >= 3) currentEnergy = 'low';
                else if (userData.lvl === 2) currentEnergy = 'med';
                else currentEnergy = 'high';
                window.initialEnergySet = true;
            }

            const now = new Date();
            const dayOfMonth = now.getDate();
            const monthIdx = now.getMonth();
            const year = now.getFullYear();
            document.getElementById('cal-month-year').innerText = `${t.months[monthIdx]} ${year}`;
            
            const firstDay = new Date(year, monthIdx, 1).getDay();
            const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
            const cal = document.getElementById('calendar-gen'); cal.innerHTML = '';
            
            t.days.forEach(d => {
                const lbl = document.createElement('div'); lbl.className = 'day-label';
                lbl.innerText = d; cal.appendChild(lbl);
            });

            for(let i=0; i < firstDay; i++) cal.appendChild(document.createElement('div'));
            for(let i=1; i<=daysInMonth; i++) {
                const d = document.createElement('div');
                const dateKey = `${year}-${monthIdx}-${i}`;
                const isDone = userData.completed.includes(dateKey);
                d.className = `day ${i===dayOfMonth?'today':''} ${isDone?'done':''}`;
                d.innerText = i;
                cal.appendChild(d);
            }
            
            renderWeeklyChart();
            setEnergy(currentEnergy);
            startClock();
        }

        function setEnergy(level) {
            currentEnergy = level;
            const now = new Date();
            const dayIndex = (now.getDate() - 1) % 31;
            const db = taskDatabase[currentLang] || taskDatabase['en'];
            const tasksAtLevel = db[level] || taskDatabase['en'][level];
            const task = tasksAtLevel[dayIndex] || tasksAtLevel[0];

            document.getElementById('daily-task-title').innerText = task.t;
            document.getElementById('daily-task-desc').innerText = task.d;
            
            document.querySelectorAll('.energy-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${level}`).classList.add('active');
        }

        function renderWeeklyChart() {
            const chart = document.getElementById('weekly-progress');
            chart.innerHTML = ''; 
            for (let i = 0; i < 7; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                if (userData && userData.completed.includes(`bar-${i}`)) {
                    bar.classList.add('active');
                }
                chart.appendChild(bar);
            }
        }

        function logTask() {
            if (!userData) return;
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const day = now.getDate();
            const dayOfWeek = now.getDay();
            const dateKey = `${year}-${month}-${day}`;
            
            if (!userData.completed.includes(dateKey)) {
                userData.completed.push(dateKey);
                if(!userData.completed.includes(`bar-${dayOfWeek}`)) {
                    userData.completed.push(`bar-${dayOfWeek}`);
                }
                localStorage.setItem('neuro_v4_0', JSON.stringify(userData));
                renderDashboard(); 
            }
        }

        function startClock() {
            if(window.clockInterval) clearInterval(window.clockInterval);
            window.clockInterval = setInterval(() => {
                const now = new Date();
                document.getElementById('real-time-clock').innerText = now.toLocaleTimeString([], { hour12: false });
            }, 1000);
        }

       function resetAll() {
    // Solo mostramos el modal que está flotando fuera del grid
    document.getElementById('custom-modal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('custom-modal').style.display = 'none';
}

function confirmReset() {
    localStorage.removeItem('neuro_v4_0');
    location.reload();
}
